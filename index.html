<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Running Coin Game</title>
<style>
  body { margin: 0; background: #87CEEB; font-family: sans-serif; }
  canvas { display: block; margin: 0 auto; background: #87CEEB; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="400"></canvas>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Player setup
let player = { x: 50, y: 300, width: 40, height: 40, dy: 0, gravity: 0.8, jumpPower: -12 };
let groundY = 300;
let coins = [];
let score = 0;
let gameSpeed = 5;

// Spawn coins
function createCoin() {
    let y = Math.random() * 200 + 50;
    coins.push({ x: canvas.width, y: y, size: 20 });
}

// Game loop
function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw ground
    ctx.fillStyle = "#228B22";
    ctx.fillRect(0, groundY + player.height, canvas.width, canvas.height - groundY);

    // Player physics
    player.dy += player.gravity;
    player.y += player.dy;
    if (player.y > groundY) { player.y = groundY; player.dy = 0; }

    // Draw player
    ctx.fillStyle = "red";
    ctx.fillRect(player.x, player.y, player.width, player.height);

    // Move and draw coins
    for (let i = coins.length - 1; i >= 0; i--) {
        coins[i].x -= gameSpeed;
        ctx.fillStyle = "gold";
        ctx.beginPath();
        ctx.arc(coins[i].x, coins[i].y, coins[i].size / 2, 0, Math.PI * 2);
        ctx.fill();

        // Collision
        if (player.x < coins[i].x + coins[i].size &&
            player.x + player.width > coins[i].x - coins[i].size &&
            player.y < coins[i].y + coins[i].size &&
            player.y + player.height > coins[i].y - coins[i].size) {
            score++;
            coins.splice(i, 1);
        }

        // Remove off-screen coins
        if (coins[i] && coins[i].x < -coins[i].size) {
            coins.splice(i, 1);
        }
    }

    // Draw score
    ctx.fillStyle = "black";
    ctx.font = "20px Arial";
    ctx.fillText("Score: " + score, 10, 30);

    requestAnimationFrame(update);
}

// Spawn coins periodically
setInterval(createCoin, 1500);

// Jump controls
document.addEventListener("keydown", function(e) {
    if ((e.key === " " || e.code === "Space") && player.y === groundY) {
        player.dy = player.jumpPower;
    }
});

update();
</script>
</body>
</html>
